# Prompt Registry
# Tracks production versioned prompt templates, schemas, and hyperparameters

version: "1.0.0"
prompts:
  skill_extraction:
    active_version: "v1"
    versions:
      v1:
        path: "system/skill_extraction_v1.jinja"
        type: "system"
        description: "Zero-shot JSON skill extraction with standard taxonomies"
        parameters:
          temperature: 0.1
          max_tokens: 1024
        input_variables:
          - description
        output_schema:
          type: object
          properties:
            skills:
              type: array

  title_canonicalization:
    active_version: "v1"
    versions:
      v1:
        path: "system/title_canonicalization_v1.jinja"
        type: "system"
        description: "Canonical title classification with confidence score"
        parameters:
          temperature: 0.0
          max_tokens: 256
        input_variables:
          - raw_title
        output_schema:
          type: object

  responsibility_summary:
    active_version: "v1"
    versions:
      v1:
        path: "system/responsibility_summary_v1.jinja"
        type: "system"
        description: "Categorized responsibility summarization"
        parameters:
          temperature: 0.2
          max_tokens: 1024
        input_variables:
          - description

  job_enrichment_user:
    active_version: "v1"
    versions:
      v1:
        path: "user/job_enrichment_v1.jinja"
        type: "user"
        description: "Context injection for job parsing"
        input_variables:
          - job_title
          - company
          - salary_raw
          - description
