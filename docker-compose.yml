# Remote 150K+ DS/AI/ML Job Search — big-data toolchain
# Usage: cp .env.example .env && docker compose up -d
# Validate: docker compose config

name: job-search

networks:
  jobs-net:
    driver: bridge

volumes:
  postgres_data:
  elasticsearch_data:
  dragonfly_data:
  minio_data:
  prefect_data:
  grafana_data:
  prometheus_data:

x-prefect-common: &prefect-common
  build:
    context: ./prefect
  environment: &prefect-env
    PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${PREFECT_DB_USER:-prefect}:${PREFECT_DB_PASSWORD:-prefect}@postgres:5432/${PREFECT_DB_NAME:-prefect}
    PREFECT_API_URL: http://prefect-server:4200/api
    PREFECT_LOGGING_LEVEL: INFO
  depends_on:
    postgres:
      condition: service_healthy
  networks:
    - jobs-net

services:
  # ------------------------------------------------------------------ Postgres + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    container_name: job-search-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-jobs}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jobs}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobs-net

  # ------------------------------------------------------------------ Elasticsearch (search index)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: job-search-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - network.host=0.0.0.0
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - jobs-net

  # ------------------------------------------------------------------ Dragonfly (Redis drop-in)
  # Dragonfly is a Redis drop-in providing BOTH cache (rate-limit/crawl frontier)
  # AND message queue via Redis Streams (XADD/XREAD/XREADGROUP) replacing Kafka.
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0
    container_name: job-search-dragonfly
    restart: unless-stopped
    command: ["--proactor_threads=2", "--maxmemory=512mb", "--port=6379"]
    ports:
      - "6380:6379"
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - jobs-net

  # ------------------------------------------------------------------ MinIO (S3-compatible data lake)
  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: job-search-minio
    restart: unless-stopped
    command: server /data --address 0.0.0.0:9000 --console-address 0.0.0.0:9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9000'"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - jobs-net

  # ------------------------------------------------------------------ Spark (master + worker)
  # NOTE: For reading/writing MinIO via s3a://, mount hadoop-aws + aws-java-sdk-bundle
  # jars into /opt/spark/jars and configure fs.s3a.* in spark-defaults.conf.
  spark-master:
    image: apache/spark:3.5.9-python3
    container_name: job-search-spark-master
    restart: unless-stopped
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master -h spark-master
    environment:
      - SPARK_MASTER_OPTS=-Djava.net.preferIPv4Stack=true
    ports:
      - "8080:8080"   # Spark master web UI
      - "7077:7077"   # Spark master RPC
    networks:
      - jobs-net

  spark-worker:
    image: apache/spark:3.5.9-python3
    container_name: job-search-spark-worker
    restart: unless-stopped
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077 -c 2 -m 2G
    environment:
      - SPARK_WORKER_OPTS=-Djava.net.preferIPv4Stack=true
    ports:
      - "8081:8081"   # Spark worker web UI
    networks:
      - jobs-net

  # ------------------------------------------------------------------ Prefect (orchestration; replaces Airflow)
  prefect-init:
    <<: *prefect-common
    container_name: job-search-prefect-init
    restart: "no"
    command: ["prefect", "server", "database", "upgrade", "-y"]
    networks:
      - jobs-net

  prefect-server:
    <<: *prefect-common
    container_name: job-search-prefect-server
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0", "--port", "4200"]
    environment:
      <<: *prefect-env
      PREFECT_UI_API_URL: http://localhost:4200/api
      PREFECT_API_ENABLE_METRICS: "true"
      PREFECT_SERVER_METRICS_ENABLED: "true"
    ports:
      - "4200:4200"
    volumes:
      - prefect_data:/root/.prefect
    depends_on:
      postgres:
        condition: service_healthy
      prefect-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:4200/api/health\", timeout=5)'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - jobs-net

  prefect-scheduler:
    <<: *prefect-common
    container_name: job-search-prefect-scheduler
    restart: unless-stopped
    # Serves scheduled deployments in-process (Prefect 3 `prefect.serve`):
    #   seed-master-data (daily), scrape-portals (daily), consume-raw-jobs (30 min).
    command: ["python", "/opt/prefect/flows/scheduler.py"]
    environment:
      <<: *prefect-env
      PYTHONPATH: /opt/prefect/flows:/opt/prefect/scrapers
      PYTHONDONTWRITEBYTECODE: "1"
      DRAGONFLY_URL: redis://dragonfly:6379/0
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-jobs}
      ELASTICSEARCH_URL: http://elasticsearch:9200
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      DICTIONARY_DIR: /opt/prefect/data/dictionaries
      SCRAPERS_DIR: /opt/prefect/scrapers
      USER_AGENT: "${SCRAPER_USER_AGENT:-JobSearchBot/1.0 (+contact: admin@example.com)}"
      SCRAPE_CRON: "${SCRAPE_CRON:-0 7 * * *}"
      SEED_CRON: "${SEED_CRON:-30 6 * * *}"
      CONSUME_INTERVAL_SECONDS: "${CONSUME_INTERVAL_SECONDS:-1800}"
      SCHEDULE_TIMEZONE: "${SCHEDULE_TIMEZONE:-America/New_York}"
    volumes:
      - ./flows:/opt/prefect/flows:ro
      - ./scrapers:/opt/prefect/scrapers:ro
      - ./data/dictionaries:/opt/prefect/data/dictionaries:ro
      - prefect_data:/root/.prefect
    depends_on:
      postgres:
        condition: service_healthy
      prefect-server:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    networks:
      - jobs-net

  # ------------------------------------------------------------------ Jupyter
  jupyter:
    image: jupyter/pyspark-notebook:spark-3.5.0
    container_name: job-search-jupyter
    restart: unless-stopped
    environment:
      - JUPYTER_ENABLE_LAB=yes
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    command: start-notebook.sh --ip=0.0.0.0 --NotebookApp.token='' --NotebookApp.password=''
    networks:
      - jobs-net

  # ------------------------------------------------------------------ Metabase (BI / dashboards)
  metabase:
    image: metabase/metabase:v0.49.13
    container_name: job-search-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_JETTY_HOST: 0.0.0.0
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-postgres}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-postgres}
      MB_DB_HOST: postgres
    ports:
      - "3101:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobs-net

  # ------------------------------------------------------------------ FastAPI service
  api:
    build:
      context: ./api
    container_name: job-search-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-jobs}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jobs-net

  # ------------------------------------------------------------------ Scraper service
  scraper:
    build:
      context: ./scrapers
    container_name: job-search-scraper
    restart: unless-stopped
    environment:
      DRAGONFLY_URL: redis://dragonfly:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      USER_AGENT: "${SCRAPER_USER_AGENT:-JobSearchBot/1.0 (+contact: admin@example.com)}"
    volumes:
      - ./scrapers:/app
    depends_on:
      dragonfly:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - jobs-net

  # ------------------------------------------------------------------ Prometheus + Grafana
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: job-search-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=0.0.0.0:9090
    networks:
      - jobs-net

  grafana:
    image: grafana/grafana:10.4.3
    container_name: job-search-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_HTTP_ADDR: 0.0.0.0
    ports:
      - "3100:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - jobs-net
