name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r api/requirements.txt
          pip install ruff

      - name: Lint Code with Ruff
        run: |
          ruff check .

      - name: Run Test Suite
        env:
          DICTIONARY_DIR: data/dictionaries
        run: |
          pytest tests/ -v --tb=short

  validate-docker:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: |
          cp .env.example .env
          docker compose config --quiet

  enforce-changelog:
    name: Enforce Mandatory Changelog Update
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md was updated
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }} HEAD | grep -E '^CHANGELOG\.md$' || true)
          if [ -z "$CHANGED" ]; then
            echo "::error::Mandatory CHANGELOG.md update missing! Every PR must update CHANGELOG.md."
            exit 1
          fi
          echo "✓ CHANGELOG.md verified in changeset."

