global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Prefect server exposes Prometheus metrics at /api/metrics
  # when PREFECT_API_ENABLE_METRICS=true (see docker-compose.yml).
  - job_name: prefect
    metrics_path: /api/metrics
    static_configs:
      - targets: ["prefect-server:4200"]

  # FastAPI exposes custom ETL metrics at /metrics (api/app/main.py).
  - job_name: etl-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
