global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Only the Prometheus self-scrape is enabled for now. The api and scraper
  # services do not expose /metrics endpoints yet; add jobs for them (and a
  # Grafana job) once real exporters exist.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
