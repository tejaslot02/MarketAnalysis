# Common responsibilities found in 150K+ DS/AI/ML job descriptions.
# Written as regex/NER-matchable phrases (lowercase, normalized) grouped by functional area.
# Use these to (a) confirm a posting is genuinely senior/technical and (b) extract a role profile.

version: "1.0"

areas:
  modeling:
    - "design, build and deploy machine learning models"
    - "develop and productionize machine learning models"
    - "build, train and evaluate deep learning models"
    - "feature engineering and feature selection"
    - "model training, validation and hyperparameter tuning"
    - "develop statistical models for prediction/classification"
    - "model experimentation and offline/online evaluation"
    - "A/B testing and causal inference"
    - "build recommendation systems"
    - "develop forecasting models"
    - "anomaly detection and fraud detection models"
    - "build ranking and personalization models"
    - "reinforcement learning for decision systems"
    - "build computer vision models (detection, segmentation, recognition)"
    - "develop NLP models (classification, NER, summarization, translation)"
    - "fine-tune transformer models"
    - "implement model interpretability and explainability"
    - "reduce model bias and improve fairness"

  data_engineering:
    - "design and maintain data pipelines"
    - "build ETL/ELT pipelines"
    - "work with large-scale datasets (petabytes)"
    - "data warehousing and data modeling"
    - "build data infrastructure for ML"
    - "data quality, validation and monitoring"
    - "stream processing (Flink, Spark Streaming)"
    - "batch processing (Spark, Hadoop)"
    - "write efficient SQL queries"
    - "feature store design and management"
    - "data lake and data lakehouse architecture"
    - "real-time data ingestion"
    - "data governance and lineage"

  mlops:
    - "deploy models to production"
    - "CI/CD for machine learning"
    - "containerize models with Docker"
    - "orchestrate models with Kubernetes"
    - "model serving and inference optimization"
    - "model monitoring and drift detection"
    - "model versioning and experiment tracking"
    - "build and maintain ML platform"
    - "automate model retraining pipelines"
    - "GPU resource management and optimization"
    - "model registry and lifecycle management"
    - "latency and throughput optimization for inference"
    - "observability and alerting for production ML"

  llm_genai:
    - "build applications with large language models"
    - "retrieval-augmented generation (RAG) pipelines"
    - "fine-tune LLMs"
    - "prompt engineering"
    - "vector databases and embeddings"
    - "build AI agents"
    - "LLM evaluation and benchmarking"
    - "guardrails and safety for generative AI"
    - "model distillation and quantization"
    - "serve open-source LLMs (Llama, Mistral)"
    - "integrate with OpenAI/Anthropic/Google APIs"
    - "multimodal models (text, image, audio, video)"
    - "RLHF (reinforcement learning from human feedback)"

  analysis_experimentation:
    - "design and analyze experiments"
    - "A/B testing and hypothesis testing"
    - "exploratory data analysis"
    - "statistical inference and significance testing"
    - "define metrics and KPIs"
    - "dashboarding and data visualization"
    - "communicate insights to stakeholders"
    - "translate business problems into data problems"
    - "build self-serve analytics"
    - "conduct deep-dive analyses"

  leadership_collaboration:
    - "lead a team of data scientists/engineers"
    - "mentor junior team members"
    - "set technical strategy and roadmap"
    - "partner with product and engineering"
    - "own the ML roadmap end to end"
    - "drive cross-functional initiatives"
    - "evangelize data-driven decision making"
    - "manage stakeholders and executive communication"
    - "hire and grow the team"
    - "define best practices and standards"
    - "work with product managers and designers"
    - "technical leadership for ML initiatives"
