# Skills and technologies for matching 150K+ DS/AI/ML roles.
# weight (0-10): importance for confirming a 150K+ senior role. Higher = stronger signal.
# aliases: alternate spellings/case used in raw job text (matched case-insensitively).

version: "1.0"

skills:
