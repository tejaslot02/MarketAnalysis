# Job portals for remote 150K+ Data Science / AI / ML roles (US market)
# Schema: name, type, url, priority, reason, api, api_note, salary_data, remote_filter, scraping_method, notes
#
# type: aggregator | remote_board | ai_specific | ats | compensation
# api: yes | restricted | no
# scraping_method: api | scrape | rss | manual
# priority: high | medium | low

version: "1.0"

portals:
  # ---------------------------------------------------------------- AGGREGATORS
  - name: LinkedIn Jobs
    type: aggregator
    url: https://www.linkedin.com/jobs/
    priority: high
    reason: Largest professional network with the highest density of 150K+ senior DS/AI/ML roles and a working salary/remote filter.
    api: restricted
    api_note: Official Jobs API (jobPostings/jobSearch) is restricted to approved partners; legacy APIs are deprecated. Scraping violates ToS — high legal risk.
    salary_data: true
    remote_filter: true
    scraping_method: scrape
    notes: Use only for manual search + saved alerts; avoid automated scraping. Boolean search supported via the UI search box.

  - name: Indeed
    type: aggregator
    url: https://www.indeed.com/
    priority: high
    reason: Highest raw posting volume in the US; solid salary estimates and remote filter.
    api: restricted
    api_note: Indeed Publisher API requires approval and is for job boards, not end-user scraping; not intended for data collection.
    salary_data: true
    remote_filter: true
    scraping_method: scrape
    notes: Heavy anti-bot (Cloudflare). Prefer Indeed Publisher API if approved, or manual exports.

  - name: Glassdoor
    type: aggregator
    url: https://www.glassdoor.com/Job/index.htm
    priority: medium
    reason: Rich salary data and company reviews; useful for compensation validation rather than volume.
    api: restricted
    api_note: Glassdoor API was deprecated years ago; no public job API.
    salary_data: true
    remote_filter: true
    scraping_method: manual
    notes: Strong anti-scraping defenses; use for salary band cross-checking and company research.

  - name: Dice
    type: aggregator
    url: https://www.dice.com/
    priority: medium
    reason: US tech-focused job board with strong coverage of engineering and ML roles; many list salary.
    api: restricted
    api_note: Dice offers a partner API for employers/ATS integrations, not public data access.
    salary_data: true
    remote_filter: true
    scraping_method: scrape
    notes: Good for MLE/ML platform roles. Respect robots.txt and rate limits.

  - name: Built In
    type: aggregator
    url: https://builtin.com/jobs
    priority: medium
    reason: Curated tech jobs with strong remote filtering and frequently posted salary bands.
    api: no
    api_note: No public API.
    salary_data: true
    remote_filter: true
    scraping_method: scrape
    notes: Has dedicated remote + salary-filtered views (e.g. builtin.com/jobs/remote).

  - name: Otta (Welcome to the Jungle)
    type: aggregator
    url: https://www.welcometothejungle.com/en
    priority: high
    reason: Modern aggregator that surfaces high-quality tech roles, many with explicit salary ranges and remote tags.
    api: restricted
    api_note: No public API; backend endpoints exist but are not documented for external use.
    salary_data: true
    remote_filter: true
    scraping_method: manual
    notes: Excellent UX for "remote" + salary filters; great source for curated leads.

  - name: Simplify.jobs
    type: aggregator
    url: https://simplify.jobs/
    priority: low
    reason: Aggregates roles from ATS platforms (Greenhouse/Lever/Ashby); useful as a secondary discovery source.
    api: no
    api_note: No public API.
    salary_data: true
    remote_filter: true
    scraping_method: manual
    notes: Duplicates many ATS postings; dedup against direct ATS sources.

  # ---------------------------------------------------------------- REMOTE BOARDS
  - name: We Work Remotely
    type: remote_board
    url: https://weworkremotely.com/
    priority: high
    reason: Largest remote-only job board; has dedicated categories for programming/dev and lists many US-timezone roles.
    api: no
    api_note: No public API, but publishes an RSS feed per category (e.g. /categories/remote-programming-jobs.rss).
    salary_data: false
    remote_filter: true
    scraping_method: rss
    notes: Salary rarely listed — cross-check band elsewhere. RSS is the cleanest ingest path.

  - name: RemoteOK
    type: remote_board
    url: https://remoteok.com/
    priority: high
    reason: Remote-only aggregator with an official RSS/JSON API and tag filtering (e.g. /remote-dev+jobs).
    api: yes
    api_note: Public API at https://remoteok.com/api (returns JSON of current listings); also /api?tag=... filters.
    salary_data: true
    remote_filter: true
    scraping_method: api
    notes: Best-effort API; includes salary when the source provides it. Rate-limit politely.

  - name: Remotive
    type: remote_board
    url: https://remotive.com/
    priority: medium
    reason: Remote-first board with an official public API and category filtering.
    api: yes
    api_note: Public API at https://remotive.com/api/remote-jobs (supports ?category=software-dev&search=).
    salary_data: true
    remote_filter: true
    scraping_method: api
    notes: Clean JSON API; good for a low-friction first scraper integration.

  - name: Remote.co
    type: remote_board
    url: https://remote.co/remote-jobs/
    priority: low
    reason: Smaller curated remote board; lower volume but occasionally lists senior AI roles.
    api: no
    api_note: No public API.
    salary_data: false
    remote_filter: true
    scraping_method: scrape
    notes: Low volume; treat as secondary source.

  - name: FlexJobs
    type: remote_board
    url: https://www.flexjobs.com/
    priority: low
    reason: Curated remote/telecommute board but paywalled (subscription required to view full listings).
    api: no
    api_note: No public API.
    salary_data: false
    remote_filter: true
    scraping_method: manual
    notes: Paywall means we cannot ethically scrape full listings; use only if you hold a subscription.

  - name: Wellfound (formerly AngelList)
    type: remote_board
    url: https://wellfound.com/jobs
    priority: medium
    reason: Startup-focused board with strong salary + equity transparency and remote filtering.
    api: restricted
    api_note: No official public API; site is a React SPA backed by private GraphQL endpoints.
    salary_data: true
    remote_filter: true
    scraping_method: manual
    notes: Great for startup ML roles with explicit comp ranges; anti-bot protections present.

  - name: Hired.com
    type: remote_board
    url: https://hired.com/
    priority: low
    reason: Marketplace where candidates are matched to employers; strong comp data but requires a profile.
    api: no
    api_note: No public API.
    salary_data: true
    remote_filter: true
    scraping_method: manual
    notes: Match-based (reverse marketplace); useful for comp benchmarking, not bulk scraping.

  # ---------------------------------------------------------------- AI / ML SPECIFIC
  - name: aijobs.net
    type: ai_specific
    url: https://aijobs.net/
    priority: high
    reason: Dedicated AI/ML job board with a strong salary filter and remote toggle.
    api: no
    api_note: No public API.
    salary_data: true
    remote_filter: true
    scraping_method: scrape
    notes: Clean, filterable UI (remote + salary) — good candidate for a dedicated adapter.

  - name: mljobs
    type: ai_specific
    url: https://mljobs.io/
    priority: low
    reason: ML-focused board; smaller volume but on-topic.
    api: no
    api_note: No public API.
    salary_data: false
    remote_filter: true
    scraping_method: scrape
    notes: Low volume; treat as long-tail source.

  - name: deeplearning.ai job board
    type: ai_specific
    url: https://www.deeplearning.ai/jobs/
    priority: medium
    reason: Curated AI roles from Andrew Ng's community; high signal-to-noise for ML engineering/research.
    api: no
    api_note: No public API.
    salary_data: false
    remote_filter: true
    scraping_method: scrape
    notes: Curated quality over quantity; salary often absent.

  - name: Kaggle jobs
    type: ai_specific
    url: https://www.kaggle.com/jobs
    priority: low
    reason: Data science community board; lower volume, occasionally unique DS roles.
    api: no
    api_note: No public API (Kaggle API is for datasets/competitions, not jobs).
    salary_data: false
    remote_filter: true
    scraping_method: scrape
    notes: Secondary source; prioritize aggregators first.

  - name: Hugging Face jobs board
    type: ai_specific
    url: https://apply.workable.com/huggingface/ (hosted via Workable)
    priority: medium
    reason: Hugging Face posts open roles via Workable ATS; highly relevant for LLM/GenAI roles.
    api: restricted
    api_note: Workable has an API for employers; public board is scrapable HTML.
    salary_data: false
    remote_filter: true
    scraping_method: scrape
    notes: HF is remote-friendly and lists many ML research/eng roles; cross-ref with Workable adapter.

  # ---------------------------------------------------------------- ATS (DIRECT)
  - name: Greenhouse
    type: ats
    url: https://boards.greenhouse.io/
    priority: high
    reason: Thousands of companies host job boards on Greenhouse; there is a public JSON endpoint per board.
    api: yes
    api_note: "Public JSON API per board: https://boards-api.greenhouse.io/v1/boards/{token}/jobs (undocumented but stable and widely used)."
    salary_data: true
    remote_filter: true
    scraping_method: api
    notes: Cleanest, lowest-friction ingest source. Maintain a list of company board tokens.

  - name: Lever
    type: ats
    url: https://jobs.lever.co/
    priority: high
    reason: Many startups post via Lever; public JSON endpoint per company.
    api: yes
    api_note: "Public JSON API per company: https://api.lever.co/v0/postings/{company}?mode=json."
    salary_data: true
    remote_filter: true
    scraping_method: api
    notes: Returns full posting JSON including location, workplace type, and sometimes salary.

  - name: Ashby
    type: ats
    url: https://jobs.ashbyhq.com/
    priority: high
    reason: Modern ATS increasingly popular with AI/ML startups; public JSON API per company.
    api: yes
    api_note: "Public JSON API per company: https://api.ashbyhq.com/posting-api/job-board/{org} (undocumented but stable)."
    salary_data: true
    remote_filter: true
    scraping_method: api
    notes: Includes comp ranges when employer provides them; strong remote/location metadata.

  - name: Workable
    type: ats
    url: https://apply.workable.com/
    priority: medium
    reason: Many companies (incl. Hugging Face) host boards on Workable.
    api: yes
    api_note: "Public JSON API per board: https://apply.workable.com/api/v3/accounts/{account}/jobs (undocumented)."
    salary_data: false
    remote_filter: true
    scraping_method: api
    notes: Salary rarely shown; rely on title/skill signals.

  # ---------------------------------------------------------------- COMPENSATION
  - name: Levels.fyi
    type: compensation
    url: https://www.levels.fyi/
    priority: high
    reason: Gold standard for total compensation (base + equity + bonus) benchmarks for 150K+ tech roles.
    api: no
    api_note: No public API; data is crowdsourced via submissions.
    salary_data: true
    remote_filter: false
    scraping_method: manual
    notes: Use to validate/calibrate the 150K+ threshold and build company-specific comp expectations.

  - name: comprehensive.io
    type: compensation
    url: https://www.comprehensive.io/
    priority: medium
    reason: Aggregates salary bands directly from published job postings (pay-transparency laws).
    api: restricted
    api_note: No public API; site compiles posted ranges.
    salary_data: true
    remote_filter: false
    scraping_method: manual
    notes: Great for calibrating realistic bands per title/company.

  - name: Blind
    type: compensation
    url: https://www.teamblind.com/
    priority: low
    reason: Anonymous tech community with salary-sharing threads; anecdotal but useful for spot checks.
    api: no
    api_note: No public API; login required for much of the content.
    salary_data: true
    remote_filter: false
    scraping_method: manual
    notes: Use as anecdotal corroboration only; low reliability.

  - name: Hacker News Who is hiring
    type: compensation
    url: https://news.ycombinator.com/item?id=whos_hiring (monthly thread)
    priority: medium
    reason: "Monthly 'Ask HN: Who is hiring?' thread lists hundreds of roles, many with remote + comp."
    api: yes
    api_note: "HN has a public Firebase API: https://hacker-news.firebaseio.com/v0/item/{id}.json."
    salary_data: true
    remote_filter: true
    scraping_method: api
    notes: Parse the monthly thread via the official HN Firebase API — no scraping needed.
